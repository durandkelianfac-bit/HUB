const cvo=(c,sel)=>CVU[c].map((u,i)=>`<option value="${i}" ${i==sel?'selected':''}>${u[0]}</option>`).join('');
function cvCat(){const c=$('#cc').value;$('#ca').innerHTML=cvo(c,0);$('#cb').innerHTML=cvo(c,1);conv()}
function cvSwap(){const a=$('#ca').value;$('#ca').value=$('#cb').value;$('#cb').value=a;conv()}
function tools(){return `<h2>🧰 Boîte à outils</h2>
<div class="card"><h3>⏱ Minuteur</h3><div style="display:flex;gap:6px"><input id="th" type="number" min="0" placeholder="h" aria-label="Heures"><input id="tm" type="number" min="0" placeholder="min" aria-label="Minutes"><input id="ts" type="number" min="0" placeholder="s" aria-label="Secondes"></div><button class="btn" onclick="tstart()">Démarrer</button><button class="btn alt" onclick="stopT()">Arrêter</button><div>${[1,5,10,15,30].map(m=>`<button class="btn alt" onclick="timer(${m*60})">${m} min</button>`).join('')}</div><div class="n" id="td"></div></div>
<div class="card"><h3>🎲 Décideur</h3><textarea id="dc" placeholder="Une option par ligne"></textarea><button class="btn" onclick="decide()">Tirer au sort</button><div class="n" id="dr" style="font-size:1.8rem"></div></div>
<div class="card"><h3>🔄 Convertisseur</h3><select id="cc" onchange="cvCat()" aria-label="Catégorie">${Object.keys(CVU).map(c=>`<option>${c}</option>`).join('')}</select><input id="cv" type="number" step="any" placeholder="Valeur" oninput="conv()"><select id="ca" onchange="conv()" aria-label="Unité de départ">${cvo('Longueur',0)}</select><button class="btn alt" onclick="cvSwap()">⇅ Inverser</button><select id="cb" onchange="conv()" aria-label="Unité d'arrivée">${cvo('Longueur',1)}</select><div class="n" id="co" style="font-size:1.8rem"></div></div>`}
let tmr,ac,ring;
function beep(){try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.3;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.25)}catch(e){}}
function stopRing(){clearInterval(ring);document.body.classList.remove('fl')}
function stopT(){clearInterval(tmr);stopRing();const e=$('#td');if(e)e.textContent=''}
function timer(sec){if(!(sec>0))return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume();clearInterval(tmr);stopRing();const end=Date.now()+sec*1e3;
 const up=()=>{const r=Math.max(0,Math.ceil((end-Date.now())/1e3)),e=$('#td');if(e)e.textContent=[Math.floor(r/3600),Math.floor(r%3600/60),r%60].map(x=>String(x).padStart(2,'0')).join(':');if(r<=0){clearInterval(tmr);let n=0;ring=setInterval(()=>{beep();document.body.classList.toggle('fl');if(++n>40)stopRing()},500)}};up();tmr=setInterval(up,250)}
function tstart(){const g=i=>+($(i).value)||0;timer(g('#th')*3600+g('#tm')*60+g('#ts'))}
function decide(){const o=$('#dc').value.split('\n').map(x=>x.trim()).filter(Boolean);if(o.length<2)return;let n=0;const r=$('#dr'),iv=setInterval(()=>{r.textContent=o[Math.floor(Math.random()*o.length)];if(++n>18){clearInterval(iv);r.textContent='👉 '+r.textContent}},90)}
function conv(){const v=parseFloat($('#cv').value),c=CVU[$('#cc').value],A=c[$('#ca').value],B=c[$('#cb').value];if(isNaN(v)){$('#co').textContent='';return}
 const base=v*A[1]+(A[2]||0),out=(base-(B[2]||0))/B[1];$('#co').textContent=(+out.toPrecision(10)).toLocaleString('fr-FR',{maximumFractionDigits:8})+' '+B[0].replace(/^.*\(([^)]+)\)$/,'$1')}
function set(){return `<h2>⚙️ Réglages</h2><div class="card"><h3>Synchronisation</h3>${!FB?'<small>Mode local : les données restent sur cet appareil. Ajoute ta config Firebase en haut du fichier pour synchroniser.</small>':user?`<p>Connecté : ${esc(user.email)}</p><button class="btn alt" onclick="firebase.auth().signOut()">Se déconnecter</button>`:'<button class="btn" onclick="login()">Connexion avec Google</button>'}</div>
<div class="card"><h3>Foyer partagé</h3><small>Même code chez chaque personne (choisis-en un long : il sert de mot de passe). Il partage les listes de courses, et ton planning si tu l'actives ci-dessous.</small><input id="cd" value="${esc(S.code)}" placeholder="Code du foyer"><button class="btn" onclick="setCode()">Enregistrer le code</button><input id="nm" value="${esc(S.name||((user&&user.displayName)||'').split(' ')[0])}" placeholder="Ton prénom affiché"><label style="display:flex;gap:10px;align-items:center;margin:6px 0"><input type="checkbox" id="sp" ${S.sharePlan?'checked':''} onchange="setShare()"> Partager mon planning avec le foyer</label><button class="btn alt" onclick="setShare()">Enregistrer mon prénom</button></div>
<div class="card"><h3>Éléments de l'accueil</h3>${HC.map(([k,n])=>`<label style="display:flex;gap:10px;align-items:center;margin:6px 0"><input type="checkbox" ${homeOn().includes(k)?'checked':''} onchange="setHome('${k}',this.checked)"> ${n}</label>`).join('')}<small>Les remboursements s'épinglent depuis leur page.</small></div>
<div class="card"><h3>Sauvegarde</h3><button class="btn" onclick="exp()">Exporter en JSON</button><input type="file" accept=".json" onchange="imp(this)"><small>Choisis un fichier exporté pour restaurer tes données.</small></div>`}
// ---- planning de travail
let pm={y:new Date().getFullYear(),m:new Date().getMonth()+1},pd=null,pim=null;
const P=window.Planning,mk=(y,m)=>y+'-'+String(m).padStart(2,'0'),sc=s=>s=='Soins intensifs'?'SI':s;
const shifts=(y,m)=>S.items.filter(i=>i.t==='shift'&&i.date.startsWith(mk(y,m)+'-')).sort((a,b)=>a.date>b.date?1:-1);
function pmove(n){pm.m+=n;if(pm.m>12){pm.m=1;pm.y++}if(pm.m<1){pm.m=12;pm.y--}pd=null;render()}
function pday(d){pd=pd==d?null:d;render()}
function psave(d){const c=$('#pc').value,old=S.items.find(i=>i.id==='shift-'+d);pd=null;if(!c){old?del(old.id):render();return}put({id:'shift-'+d,t:'shift',ts:Date.now(),...P.shiftFrom(d,c)})}
function pdecode(){const t=$('#pt').value;pim={text:t,year:+$('#py').value,res:null};pim.res=P.decode(t,{year:pim.year});render()}
function pvalid(){const r=pim.res,k=mk(r.year,r.month)+'-',ids=new Set(r.shifts.map(s=>'shift-'+s.date));
 S.items.filter(i=>i.t==='shift'&&i.date.startsWith(k)&&!ids.has(i.id)).forEach(i=>push(i,1));
 S.items=S.items.filter(i=>!(i.t==='shift'&&i.date.startsWith(k)));
 r.shifts.forEach(s=>{const it={id:'shift-'+s.date,t:'shift',ts:Date.now(),...s};S.items.push(it);push(it)});
 pm={y:r.year,m:r.month};pim=null;save();render()}
function pimp(){const r=pim.res;
 if(!r||!r.ok)return `<h2>🗓 Importer mon planning</h2><div class="card"><textarea id="pt" placeholder="Novembre RH J3 RH N3 N3…" style="min-height:120px">${esc(pim.text)}</textarea><input id="py" type="number" value="${pim.year}" aria-label="Année"><small>Année utilisée si elle n'est pas écrite dans le texte. Un tiret « - » = jour sans information.</small><br><button class="btn" onclick="pdecode()">Décoder</button><button class="btn alt" onclick="pim=null;render()">Annuler</button></div>`+(r?`<div class="card"><h3>À corriger</h3>${r.errors.map(e=>`<p>⚠️ ${esc(e.message)}</p>`).join('')}</div>`:'');
 return `<h2>🗓 Vérification</h2><div class="card"><h3>${P.MOIS[r.month-1]} ${r.year} · ${r.shifts.length} poste${r.shifts.length>1?'s':''}</h3><table style="width:100%;border-collapse:collapse"><tr><th align="left">Jour</th><th align="left">Code</th><th align="left">Poste</th></tr>${r.days.map(d=>`<tr style="${d.kind=='travail'?'font-weight:600':'color:var(--mu)'}"><td>${fd(d.date)}</td><td>${d.code}</td><td>${esc(d.label)}</td></tr>`).join('')}</table></div><small>Valider remplace les postes déjà enregistrés pour ce mois.</small><br><button class="btn" onclick="pvalid()">Valider le planning</button><button class="btn alt" onclick="pim.res=null;render()">Modifier</button>`}
function exportICS(){const a=shifts(pm.y,pm.m);if(!a.length){alert('Aucun poste à exporter ce mois-ci.');return}const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([P.toICS(a)],{type:'text/calendar'}));l.download='planning-'+mk(pm.y,pm.m)+'.ics';l.click()}
function plan(){if(pim)return pimp();
 const{y,m}=pm,n=P.daysIn(y,m),off=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7,sh=shifts(y,m),by=Object.fromEntries(sh.map(s=>[s.date,s])),ot=(user?(R.sh||[]).filter(x=>x.owner!==user.uid&&x.date.startsWith(mk(y,m)+'-')):[]).sort((a,b)=>a.date>b.date?1:-1);
 let g=['L','M','M','J','V','S','D'].map(d=>`<small class="dw">${d}</small>`).join('')+'<i></i>'.repeat(off);
 const fr=[],ow=new Set(ot.map(x=>x.owner)).size;for(let d=1;d<=n;d++){const dt=mk(y,m)+'-'+String(d).padStart(2,'0'),s=by[dt],fz=ow&&!s&&!ot.some(x=>x.date==dt);if(fz)fr.push(d);g+=`<div class="cd ${s?s.type:''} ${fz?'rc':''} ${dt==today?'td':''} ${dt==pd?'sel':''}" onclick="pday('${dt}')"><b>${d}</b>${s?`<span>${s.code}</span><small>${esc(sc(s.secteur))}</small>`:''}${ot.filter(x=>x.date==dt).map(x=>`<small style="color:var(--ac2)">${esc((x.name||'?')[0])}·${x.code}</small>`).join('')}</div>`}
 const s0=by[pd],ed=pd?`<div class="card"><h3>${fd(pd)}</h3><select id="pc"><option value="">Aucun poste (repos)</option>${Object.entries(P.CODES).map(([c,v])=>`<option value="${c}" ${s0&&s0.code==c?'selected':''}>${v.titre}</option>`).join('')}</select><button class="btn" onclick="psave('${pd}')">Enregistrer</button><button class="btn alt" onclick="pday('${pd}')">Fermer</button></div>`:'';
 return `<h2>🗓 Planning</h2><div class="card"><div class="pn"><button class="btn alt" onclick="pmove(-1)" aria-label="Mois précédent">‹</button><h3>${P.MOIS[m-1]} ${y}</h3><button class="btn alt" onclick="pmove(1)" aria-label="Mois suivant">›</button></div><div class="cal">${g}</div><small>Touche un jour pour ajouter, changer ou supprimer un poste.</small>${ow?`<br><small>Repos en commun (cadre vert) : ${fr.length?fr.join(', '):'aucun ce mois-ci'}</small>`:''}</div>${ed}<button class="btn" onclick="pim={text:'',year:pm.y,res:null};render()">Importer mon planning</button><button class="btn alt" onclick="exportICS()">Exporter vers le Calendrier (.ics)</button><h3 style="margin-top:12px">Postes du mois (${sh.length})</h3>${sh.map(s=>`<div class="row"><div class="g"><b>${fd(s.date)} · ${esc(s.titre)}</b><small>${s.debut} → ${s.finLeLendemain?fd(s.finDate)+' ':''}${s.fin} · rappel à ${s.rappel}</small></div><span class="chip">${s.type=='nuit'?'🌙':'☀️'} ${s.code}</span></div>`).join('')||'<p class="mu">Aucun poste ce mois-ci.</p>'}${ot.length?'<h3 style="margin-top:12px">Planning du foyer</h3>'+ot.map(s=>`<div class="row"><div class="g"><b>${fd(s.date)} · ${esc(s.name||'?')} · ${esc(s.titre)}</b><small>${s.debut} → ${s.finLeLendemain?fd(s.finDate)+' ':''}${s.fin}</small></div><span class="chip">${s.type=='nuit'?'🌙':'☀️'} ${s.code}</span></div>`).join(''):''}`}
function search(){const a=S.items.filter(i=>['title','text','url'].some(k=>String(i[k]||'').toLowerCase().includes(q))&&T[i.t]);return `<h2>Résultats</h2>`+(a.map(row).join('')||'<p class="mu">Aucun résultat.</p>')}
const NAV=[['home','home',"Aujourd'hui"],['plan','planning','Planning'],['task','tasks','Tâches'],['shop','shop','Courses']];
const MORE=[['note','notes','Notes'],['idea','ideas','Idées'],['wish','wish','Envies'],['site','sites','Mes sites'],['loan','loan','Remboursements'],['count','calendar','Dates'],['tools','tools','Boîte à outils'],['set','settings','Réglages']];
const TTL=Object.fromEntries([...NAV,...MORE].map(x=>[x[0],x[2]]));
$('#nav').innerHTML=NAV.map(([t,i,n])=>`<a data-t="${t}" onclick="go('${t}')" role="button" tabindex="0">${DS.icon(i,{size:22})}<span>${n}</span></a>`).join('')+`<a data-t="more" onclick="openMore()" role="button" tabindex="0" aria-haspopup="dialog">${DS.icon('more',{size:22})}<span>Plus</span></a>`;
$('#bq').innerHTML=DS.icon('search');$('#ba').innerHTML=DS.icon('plus');
const calm=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function toggleQ(){const h=document.querySelector('.hd');h.classList.toggle('s');if(h.classList.contains('s'))$('#q').focus();else{$('#q').value='';q='';render()}}
function openMore(){const d=document.createElement('div');d.className='sheetbg';

 const k=e=>{if(e.key=='Escape'){d.remove();removeEventListener('keydown',k)}};addEventListener('keydown',k);
 d.onclick=e=>{const b=e.target.closest('.mrow');if(b){d.remove();go(b.dataset.t)}else if(e.target==d)d.remove()};document.body.append(d);
 if(!calm())try{DS.animate(d.firstChild,{transform:['translateY(24px)','translateY(0px)'],opacity:[0,1]},{duration:.32,ease:[.22,1,.36,1]})}catch(e){}}
function tidy(){const h=$('#app>h2');if(!h)return;const t=h.textContent.replace(/^[\p{Extended_Pictographic}\uFE0F\s]+/u,'').trim();h.textContent=t;if(t==$('#ttl').textContent)h.hidden=true}
function stat(){const e=$('#st');if(!e)return;const[i,l]=!FB?['cloudOff','Mode local (non synchronisé)']:!user?['cloudOff','Non connecté — touche pour te connecter']:navigator.onLine?['cloud','Connecté et synchronisé']:['cloudOff','Hors connexion'];e.innerHTML=DS.icon(i);e.setAttribute('aria-label',l);e.title=l}
let lastTab=null;
function render(){stat();$('#ttl').textContent=q?'Recherche':(TTL[tab]||'');$('#app').innerHTML=q?search():({home,loan,tools,set,plan}[tab]||(()=>list(tab)))();tidy();
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t==tab||(a.dataset.t=='more'&&MORE.some(m=>m[0]==tab))));
 if(tab!==lastTab){lastTab=tab;if(!calm())try{DS.animate($('#app'),{opacity:[0,1]},{duration:.15})}catch(e){}}}
let tx=0,ty=0;const ap=$('#app');ap.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
ap.addEventListener('touchend',e=>{const r=e.target.closest('.row[data-id]');if(!r)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dy)>40||Math.abs(dx)<90)return;const id=r.dataset.id;if(dx>0){const it=S.items.find(x=>x.id==id);if(it&&'done' in it)tog(id)}else del(id)},{passive:true});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('online',render);addEventListener('offline',render);render();
